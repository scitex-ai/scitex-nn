name: auto-merge-to-develop

# Thin caller. The body lives ONCE, org-side, in scitex-ai/.github@main.
# Converted from a local fork per PS-231 (audit-all green run): a local copy
# does not track upstream fixes — e.g. the org copy already contains the
# "QUEUED checks counted as green" fix our fork lacked (a CheckRun that has
# not finished has `conclusion: null` and no `.state`, so our naive
# `(.conclusion // .state // "")` counted all-queued PRs as passing).
#
# REQUIRED-CONTEXT CHECK (PS-231 blocker 1), verified before converting:
# `gh api repos/scitex-ai/scitex-nn/branches/{develop,main}/protection`
# requires ONLY `pytest-matrix-on-ubuntu-py3.{11,12,13}`. This workflow
# publishes no required context, so the job rename (`automerge` ->
# `auto-merge-to-develop`) cannot wedge branch protection on either branch.
#
# `runs_on` is passed explicitly rather than inherited: a destination with a
# security property must not ride someone else's default, which can change
# upstream by a review nobody here sees.

on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

jobs:
  auto-merge-to-develop:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    with:
      # JSON array STRING — consumed by fromJSON in the callee. A YAML list
      # decodes to something fromJSON rejects and the job queues forever.
      runs_on: '["ubuntu-latest"]'
    secrets: inherit
