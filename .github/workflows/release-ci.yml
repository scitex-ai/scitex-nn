name: release-ci

# Post-merge validation gate. Runs on push to protected branches
# (main, develop) and as the canonical scheduled run. Always uses the
# FULL pytest matrix — no conditional skipping — so the protected-branch
# history is exercised on every supported Python.
#
# L1 concurrency — coalesce overlapping pushes on the same branch.
# L5a uv-managed Python (`uv python install` + `uv venv --python`) so each
#     matrix leg pins its interpreter independently of the runner.
# L5b .venv/bin on PATH so console scripts resolve without `uv run`.

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    # New required-status-check contexts:
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.11"
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.12"
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.13"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  audit:
    # New required-status-check context: "quality-audit / audit"
    # NOTE: the reusable audit command drops the old `--no-version-check`
    # flag (it runs `scitex-dev ecosystem audit-all "$DIST" --path "$PWD"`
    # instead) — this may surface previously-suppressed version-check
    # findings on this repo.
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
