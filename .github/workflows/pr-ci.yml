name: pr-ci

# Consolidated PR-only CI gate. Runs the per-PR validation suite as a
# single workflow so the cancel-in-progress concurrency group, path
# filters, and uv cache apply uniformly. Post-merge validation lives
# in release-ci.yml.
#
# L1 concurrency — cancel superseded PR runs.
# L3 path filters — skip docs/skills/examples/markdown-only PRs.
# L4 conditional matrix — full ["3.11", "3.12", "3.13"] on PR (this trigger).
# L5a uv-managed Python (`uv python install` + `uv venv --python`) so the
#     matrix leg is not bound to the runner's system Python.
# L5b .venv/bin on PATH (and explicit `.venv/bin/python` for clarity) so
#     console scripts resolve without needing `uv run`.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '_skills/**'
      - 'examples/**'
      - '**.md'
      - 'CHANGELOG.*'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  dep-hygiene-smoke:
    name: dep-hygiene-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.11 (uv-managed)
        run: uv python install 3.11
      - name: Bare install (no extras) in uv venv
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python .
      - name: Import package
        run: .venv/bin/python -c "import scitex_nn; print(scitex_nn.__name__)"

  tests:
    # New required-status-check contexts:
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.11"
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.12"
    #   "pytest-matrix / pytest-matrix-on-ubuntu-py3.13"
    # NOTE: the reusable workflow always runs the full 3.11/3.12/3.13
    # matrix (no input to shrink it) — this PR loses the old
    # workflow_dispatch-only cost-saving reduction to a single 3.12 leg.
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  audit:
    # New required-status-check context: "quality-audit / audit"
    # NOTE: the reusable audit command drops the old `--no-version-check`
    # flag (it runs `scitex-dev ecosystem audit-all "$DIST" --path "$PWD"`
    # instead) — this may surface previously-suppressed version-check
    # findings on this repo.
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
