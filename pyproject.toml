[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-nn"
version = "0.1.16"
description = "Neural network building blocks (BNet, Hilbert, PAC, Wavelet, Filters, …) — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "neural-network", "pytorch", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib",
    "numpy",
    "torch",
    "torchaudio",
    "torchsummary",
    "julius",
    # `scipy` is a hard runtime dep: `src/scitex_nn/_Filters.py` imports
    # `design_filter` from `_vendor_dsp_utils/filter.py`, whose module-level
    # `from scipy.signal import firwin, freqz` executes on that path. The
    # 2026-06-13 sweep comment claiming zero scipy imports is stale (the
    # vendored filter module postdates it); audit PS-233 confirms the import.
    "scipy",
    "xarray",
    "scitex-decorators>=0.1.1",
    "scitex-config>=0.3.0",
    "scitex-gen>=0.1.10",
    # scitex-math owns to_even / to_odd since their standalonization out
    # of scitex_gen. Imported at module-load by _Filters, _Wavelet, and
    # _vendor_dsp_utils/* — without this pin bare `pip install scitex-nn`
    # followed by `import scitex_nn._Wavelet` raises ImportError.
    "scitex-math>=0.1.0",
    # Declared because package source logs via scitex-logging (PS-220):
    # several modules call `slogging.getLogger(__name__)` at import time.
    "scitex-logging",
]

[project.optional-dependencies]
dev = [
    "joblib",
    "flask",
    "ipdb",
    "pytest",
    "pytest-cov",
    "ruff",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-nn[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-nn"
Repository = "https://github.com/ywatanabe1989/scitex-nn"
Documentation = "https://scitex-nn.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_nn = ["_skills/**/*.md"]

[project.entry-points."scitex_dev.skills"]
scitex-nn = "scitex_nn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]
markers = [
    "e2e: slow end-to-end workflows against real subsystems (RUN_E2E=1 to run)",
]

[tool.scitex_dev]
# No CLI surface (no console entry points): smoke layer does not apply (PS-211).
no_cli = true

[tool.coverage.run]
parallel = true
source = ["scitex_nn"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples", "apps", "config", "docs"]

dependencies = [
    "scitex-dev>=0.17.8",
]
